# Jenkins Configuration as Code — Softon Portal (minimal)
# Provisiona apenas admin + credenciais + tool Maven. Resto fica com
# defaults seguros do Jenkins moderno.

jenkins:
  systemMessage: "Jenkins Softon Portal — pipeline build-on-tag"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "github-pat-softon"
              secret: "${GITHUB_PAT:-}"
              description: "GitHub PAT — upload de releases"
          - string:
              scope: GLOBAL
              id: "softon-portal-webhook-secret"
              secret: "${PORTAL_WEBHOOK_SECRET:-}"
              description: "Webhook secret do Softon Portal"
          - usernamePassword:
              scope: GLOBAL
              id: "github-user-pat"
              username: "${GITHUB_USER:-}"
              password: "${GITHUB_PAT:-}"
              description: "GitHub username + PAT (clone HTTPS)"

# JDK 21 já vem instalado na imagem base (lts-jdk21).
# Maven baixado automaticamente na primeira execução de pipeline.
tool:
  jdk:
    installations:
      - name: "jdk-21"
        home: "/opt/java/openjdk"
  maven:
    installations:
      - name: "maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"
