# Jenkins Configuration as Code — Softon Portal
# Provisiona admin, tools (jdk-21 + maven-3.9) e credenciais no boot.
#
# Plugin: configuration-as-code
# Spec:   https://github.com/jenkinsci/configuration-as-code-plugin

jenkins:
  systemMessage: |
    Jenkins Softon Portal — pipeline build-on-tag.
    Veja: docs/jornadas/10-fluxo-local-completo-com-jenkins.md

  # Realm de segurança: admin local cuja senha vem de env var.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  # Estratégia: admin tem tudo; demais usuários autenticados têm leitura.
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "USER:Overall/Administer:${JENKINS_ADMIN_USER:-admin}"
        - "GROUP:Overall/Read:authenticated"

  # CSRF + agent-to-master security ligados (default seguro).
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false
  remotingSecurity:
    enabled: true

# Credenciais lidas de env vars — sem segredos no arquivo.
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "github-pat-softon"
              secret: "${GITHUB_PAT}"
              description: "GitHub PAT — upload de releases (escopo repo)"
          - string:
              scope: GLOBAL
              id: "softon-portal-webhook-secret"
              secret: "${PORTAL_WEBHOOK_SECRET}"
              description: "Webhook secret do Softon Portal (S11 P2)"
          - usernamePassword:
              scope: GLOBAL
              id: "github-user-pat"
              username: "${GITHUB_USER}"
              password: "${GITHUB_PAT}"
              description: "GitHub username + PAT como senha (para clone via HTTPS)"

# Tools configuradas automaticamente — nomes referenciados no Jenkinsfile template.
tool:
  jdk:
    installations:
      - name: "jdk-21"
        properties:
          - installSource:
              installers:
                - adoptOpenJdkInstaller:
                    id: "jdk-21.0.4+7"
  maven:
    installations:
      - name: "maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

# Configurações sem segredos.
unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8090/}"
    adminAddress: "softon-portal@localhost"
  timestamper:
    allPipelines: true
    systemTimeFormat: "'<b>'HH:mm:ss'</b> '"
