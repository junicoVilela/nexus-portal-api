spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: doc-flow-backend

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
