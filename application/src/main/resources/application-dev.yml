# Perfil `dev` — banco e JWT com defaults locais (nunca use estes segredos em produção).

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexus_platform}
    username: ${DB_USERNAME:nexus_platform}
    password: '${DB_PASSWORD:nexus!@#}'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  health:
    mail:
      enabled: false

docflow:
  storage:
    publicacoes-dir: ${PUBLICACOES_DIR:./storage/publicacoes}
  notificacoes:
    habilitado: ${NOTIFICACOES_EMAIL_HABILITADO:false}
    admin-email: ${NOTIFICACOES_ADMIN_EMAIL:}
  security:
    admin-password: ${ADMIN_PASSWORD:admin}
    editor-password: ${EDITOR_PASSWORD:editor}
    jwt-secret: ${JWT_SECRET:doc-flow-dev-only-jwt-secret-min-256-bits-do-not-use-in-production-change-me}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    jwt-download-expiration-ms: ${JWT_DOWNLOAD_EXPIRATION_MS:900000}
    gateway-api-key: ${GATEWAY_API_KEY:doc-flow-dev-gateway-key}
  cors:
    # Sobrescreva quando o frontend for aberto por IP, hostname ou outra porta.
    # Não usar `*`: o portal envia o JWT no header Authorization.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://localhost:4300,http://127.0.0.1:4300}

release-orchestrator:
  storage:
    artefatos-dir: ${ARTEFATOS_DIR:./storage/artefatos}
    entregas-dir: ${ENTREGAS_DIR:./storage/entregas}
  linux-manual:
    # Lab: CRIAR copia scripts/templates/artifacts (sem JDK/Tomcat) e roda install.sh.
    template-dir: ${LINUX_MANUAL_TEMPLATE_DIR:/home/junico-home/Documentos/Softon/V5/instalador/instalador}
    allow-local-fs: true

nexus:
  ai:
    # Dev: ligado por padrão. Sem key → FakeLlmProvider; com OPENROUTER/NEXUS key → OpenRouter.
    enabled: ${NEXUS_AI_ENABLED:true}
    base-url: ${NEXUS_AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${NEXUS_AI_API_KEY:${OPENROUTER_API_KEY:}}
    model: ${NEXUS_AI_MODEL:openai/gpt-5.6-luna}
    reasoning-effort: ${NEXUS_AI_REASONING_EFFORT:low}
    http-referer: ${NEXUS_AI_HTTP_REFERER:http://localhost:4200}
    app-title: ${NEXUS_AI_APP_TITLE:Nexus AI}
    timeout-seconds: ${NEXUS_AI_TIMEOUT_SECONDS:90}
    max-perguntas: ${NEXUS_AI_MAX_PERGUNTAS:5}
    max-tokens-saida: ${NEXUS_AI_MAX_TOKENS_SAIDA:8000}
    max-geracoes-por-hora: ${NEXUS_AI_MAX_GERACOES_POR_HORA:20}

logging:
  level:
    com.nexus.portal.docflow: DEBUG
    com.nexus.portal.ai: DEBUG
