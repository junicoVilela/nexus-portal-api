# Perfil `prod` — banco e segredos apenas por variável de ambiente (sem defaults no YAML).

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    root: WARN
    br.com.softon.docflow: INFO
    org.springframework.web: WARN

docflow:
  storage:
    publicacoes-dir: ${PUBLICACOES_DIR}
  notificacoes:
    habilitado: ${NOTIFICACOES_EMAIL_HABILITADO:false}
    admin-email: ${NOTIFICACOES_ADMIN_EMAIL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    admin-password: ${ADMIN_PASSWORD}
    editor-password: ${EDITOR_PASSWORD}
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    jwt-download-expiration-ms: ${JWT_DOWNLOAD_EXPIRATION_MS:900000}
    gateway-api-key: ${GATEWAY_API_KEY}
