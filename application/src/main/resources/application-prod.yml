# Perfil `prod` — banco e segredos apenas por variável de ambiente (sem defaults no YAML).

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    root: WARN
    com.nexus.portal.docflow: INFO
    org.springframework.web: WARN

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

docflow:
  storage:
    publicacoes-dir: ${PUBLICACOES_DIR}
  notificacoes:
    habilitado: ${NOTIFICACOES_EMAIL_HABILITADO:false}
    admin-email: ${NOTIFICACOES_ADMIN_EMAIL}
  cors:
    # Exemplo: https://portal.nexus.com.br ou https://portal.nexus.local
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    admin-password: ${ADMIN_PASSWORD}
    editor-password: ${EDITOR_PASSWORD}
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    jwt-download-expiration-ms: ${JWT_DOWNLOAD_EXPIRATION_MS:900000}
    gateway-api-key: ${GATEWAY_API_KEY}

# AI off por padrão em prod até configurar NEXUS_AI_* / OPENROUTER_API_KEY.
nexus:
  ai:
    enabled: ${NEXUS_AI_ENABLED:false}
    base-url: ${NEXUS_AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${NEXUS_AI_API_KEY:${OPENROUTER_API_KEY:}}
    model: ${NEXUS_AI_MODEL:openai/gpt-4o-mini}
    http-referer: ${NEXUS_AI_HTTP_REFERER:}
    app-title: ${NEXUS_AI_APP_TITLE:Nexus AI}
    timeout-seconds: ${NEXUS_AI_TIMEOUT_SECONDS:90}
    max-perguntas: ${NEXUS_AI_MAX_PERGUNTAS:5}
    max-tokens-saida: ${NEXUS_AI_MAX_TOKENS_SAIDA:8000}
    max-geracoes-por-hora: ${NEXUS_AI_MAX_GERACOES_POR_HORA:20}
